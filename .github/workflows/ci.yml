name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-dotnet }
      # Golden snapshot fixtures and the beacon pinned to its vendored release tag.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - id: beacon
        shell: bash
        run: |
          f=camada-dotnet/src/Camada/Resources/beacon.json
          v=$(jq -r '.version // empty' "$f")
          [ -n "$v" ] || { echo "::error::no vendored beacon version in $f"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          path: camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: camada-dotnet/global.json }
      - run: dotnet format --verify-no-changes
        working-directory: camada-dotnet
      - run: dotnet build -warnaserror
        working-directory: camada-dotnet
      - run: dotnet test --no-build
        working-directory: camada-dotnet
